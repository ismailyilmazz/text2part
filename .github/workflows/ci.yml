name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Sistem kütüphaneleri
        run: sudo apt-get update && sudo apt-get install -y libgl1 libx11-6
      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ortam raporu
        run: python -m text2part.envcheck
      - name: Testler
        run: pytest -ra
      - name: Lint
        run: ruff check .
      - name: Biçim
        run: ruff format --check .

  stress:
    name: Zorlama testleri
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Sistem kütüphaneleri
        run: sudo apt-get update && sudo apt-get install -y libgl1 libx11-6
      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Oluşturucu zorlama testi
        run: python scripts/stress_builder.py
      - name: RCQ zorlama testi
        run: python scripts/stress_rcq.py
      - name: Doğrulama kalibrasyonu
        run: python scripts/calibrate_verify.py
