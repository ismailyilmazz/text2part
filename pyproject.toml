[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "text2part"
version = "0.1.0"
description = "Text-to-CAD part generation for FreeCAD with a fine-tuned small language model and a measurement-driven repair loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cadquery==2.8.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.14.1"]

[tool.setuptools.packages.find]
include = ["text2part*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
